name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BIN_NAME: utui
  TAP_REPO: kodeflowstudios/homebrew-tap

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          archive="${BIN_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" "$BIN_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Compute sha256 of source tarball
        id: sha
        run: |
          curl -fsSL -o source.tar.gz \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          sha=$(shasum -a 256 source.tar.gz | cut -d ' ' -f 1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          version="${{ needs.release.outputs.version }}"
          sha="${{ steps.sha.outputs.sha256 }}"
          formula="tap/Formula/${BIN_NAME}.rb"

          sed -i \
            -e "s|url \".*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz\"|" \
            -e "s|sha256 \".*\"|sha256 \"$sha\"|" \
            "$formula"

      - name: Commit and push formula update
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${BIN_NAME}.rb"
          git commit -m "Update ${BIN_NAME} to ${{ github.ref_name }}" || echo "no changes"
          git push
